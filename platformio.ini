; PlatformIO Project Configuration File for M5Stack Cardputer
; NyanBox Firmware Build Configuration

[platformio]
default_envs = cardputer
src_dir = applications/nyanbox
include_dir = lib/nyanbox-hal

[env:cardputer]
platform = espressif32
board = m5stack-stamps3
framework = arduino

; Build flags
build_flags = 
    -DPLATFORM_CARDPUTER
    -DBOARD_HAS_PSRAM
    -DARDUINO_M5STACK_CARDPUTER
    -DCORE_DEBUG_LEVEL=0
    -I lib/nyanbox-hal
    -I applications/nyanbox
    -std=gnu++11

; Upload settings
upload_speed = 1500000
monitor_speed = 115200

; Dependencies
lib_deps = 
    m5stack/M5GFX @ ^0.1.11
    m5stack/M5Unified @ ^0.1.11
    bblanchon/ArduinoJson @ ^6.21.3

; ESP32-S3 specific settings
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default.csv

; Memory configuration
board_upload.maximum_size = 8388608
board_upload.maximum_ram_size = 327680

; Build options
build_type = release
; Uncomment for debug builds
; build_type = debug
; build_flags = ${env:cardputer.build_flags} -DCORE_DEBUG_LEVEL=5

[env:cardputer-ota]
extends = env:cardputer
upload_protocol = espota
upload_port = nyanbox-cardputer.local
upload_flags = 
    --port=3232
    --auth=nyanbox

[env:cardputer-debug]
extends = env:cardputer
build_type = debug
build_flags = 
    ${env:cardputer.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DDEBUG_ESP_PORT=Serial
    -DDEBUG_ESP_CORE
monitor_filters = esp32_exception_decoder

; Additional build environments

[env:flipper-f7]
; This would be built using the standard Flipper build system
; Include here for reference only
platform = ststm32
board = generic_stm32wb55rg
framework = stm32cube

; Just reference - actual build via Makefile
extra_scripts = 
    pre:scripts/flipper_build.py
